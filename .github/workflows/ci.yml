name: CI

on:
  push:
    branches: [Main]
  pull_request:
    branches: [Main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build project (optional)
        run: npm run build --if-present

      - name: Run Vitest
        run: npm run test -- --run
